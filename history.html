<!-- lang.js must load before this script -->
<script src="lang.js"></script>
<script>
// supabase.js loaded earlier provides Storage, AuthStorage, DataStore, SupabaseConfig.
// HistStorage retained as thin appStorage wrapper for theme (UI-only state).
const HistStorage = {
  get(key, fallback = null) {
    try { const r = appStorage.get(key); return r === null ? fallback : JSON.parse(r); }
    catch { return fallback; }
  },
  set(key, value) {
    try { appStorage.set(key, JSON.stringify(value)); return true; }
    catch { return false; }
  }
};

// ── Utilities ──
const fmt = (n) => new Intl.NumberFormat('id-ID', { style:'currency', currency:'IDR', minimumFractionDigits:0 }).format(n);

function escapeHtml(str) {
  return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function fmtDate(iso) {
  const lang = LangManager.current === 'id' ? 'id-ID' : 'en-US';
  return new Date(iso).toLocaleString(lang, { weekday:'long', year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit' });
}

// ── Theme ──
function initTheme() {
  const saved = HistStorage.get('theme') || 'light';
  document.body.className = `${saved}-theme`;
  document.getElementById('theme-toggle').querySelector('i').className = saved === 'light' ? 'fas fa-moon' : 'fas fa-sun';
}

document.getElementById('theme-toggle').addEventListener('click', () => {
  const isDark = document.body.classList.contains('dark-theme');
  const next   = isDark ? 'light' : 'dark';
  document.body.className = `${next}-theme`;
  HistStorage.set('theme', next);
  document.getElementById('theme-toggle').querySelector('i').className = next === 'light' ? 'fas fa-moon' : 'fas fa-sun';
});

// ── Language ──
function applyLang() {
  const lang = LangManager.current;
  document.documentElement.lang = lang;
  document.getElementById('lang-label').textContent       = lang === 'en' ? 'ID' : 'EN';
  document.getElementById('history-title').textContent    = t('historyTitle');
  document.title = `${t('appTitle')} — ${t('historyTitle')}`;
  document.getElementById('btn-back-label').textContent   = t('back');
  document.getElementById('hist-confirm-pin-label').textContent = t('deletePinLabel');
  document.getElementById('hist-confirm-cancel-label').textContent = t('cancel');
  document.getElementById('hist-confirm-ok-label').textContent = t('deleteShift');
  document.getElementById('select-all-label').textContent = t('selectAll');
  document.getElementById('delete-selected-label').textContent = t('deleteSelected');
  // Date filter labels
  document.getElementById('hist-date-label').textContent = t('dateRange');
  document.getElementById('report-search-label').textContent = t('search');
  document.getElementById('report-search').placeholder = t('reportSearchPlaceholder');
  const presetMap = { all: 'dateAll', today: 'dateToday', week: 'dateWeek', month: 'dateMonth', custom: 'dateCustom' };
  document.querySelectorAll('.date-preset').forEach(b => {
    b.textContent = t(presetMap[b.dataset.preset]);
  });
  renderList();   // re-render with new language
  renderChart();  // chart labels are translated
}

document.getElementById('lang-toggle').addEventListener('click', () => {
  LangManager.toggle();
  applyLang();
});

// ── Navigation ──
document.getElementById('btn-back').addEventListener('click', () => window.location.href = 'index.html');

// ── Alert ──
function showAlert(message, type = 'info') {
  const div = document.createElement('div');
  div.className = `alert ${type}`;
  const p = document.createElement('p'); p.textContent = message;
  const x = document.createElement('span'); x.className = 'close-alert'; x.textContent = '×';
  div.appendChild(p); div.appendChild(x);
  document.getElementById('alert-container').appendChild(div);
  setTimeout(() => div.classList.add('show'), 10);
  const hide = () => { div.classList.remove('show'); setTimeout(() => div.remove(), 300); };
  setTimeout(hide, 5000);
  x.addEventListener('click', hide);
}

// ── State ──
// `history` is bound to DataStore.shifts (shared reference) inside init() once hydrated.
// Empty array until init runs; renderList() handles empty state.
let history  = [];
let selectedIds = new Set();
let dateFilter  = { preset: 'month', from: null, to: null };
let reportQuery = '';
let reportPage  = 1;
const REPORT_PAGE_SIZE = 10;

// ── Date filter helpers ──
function dateBounds() {
  const { preset, from, to } = dateFilter;
  if (preset === 'all') return null;
  const now = new Date();
  const startOfDay = (d) => { const x = new Date(d); x.setHours(0,0,0,0); return x.getTime(); };
  const endOfDay   = (d) => { const x = new Date(d); x.setHours(23,59,59,999); return x.getTime(); };
  if (preset === 'today') return [startOfDay(now), endOfDay(now)];
  if (preset === 'week') {
    const d = new Date(now);
    const dow = d.getDay();
    d.setDate(d.getDate() + (dow === 0 ? -6 : 1 - dow)); // Monday as start
    return [startOfDay(d), endOfDay(now)];
  }
  if (preset === 'month') {
    const d = new Date(now.getFullYear(), now.getMonth(), 1);
    return [startOfDay(d), endOfDay(now)];
  }
  if (preset === 'custom' && from && to) {
    return [startOfDay(new Date(from)), endOfDay(new Date(to))];
  }
  return null;
}

// A shift is in range when its open period overlaps the range: a month-end close
// on the 1st still belongs to the month it covers.
function getFilteredShifts() {
  const range = dateBounds();
  const dated = !range ? history : history.filter(s => {
    const [from, to] = range;
    const end   = new Date(s.closedAt).getTime();
    const start = s.startedAt ? new Date(s.startedAt).getTime() : end;
    return start <= to && end >= from;
  });
  const q = reportQuery.trim().toLowerCase();
  if (!q) return dated;
  return dated.filter(s => shiftSearchText(s).includes(q));
}

function shiftSearchText(shift) {
  const parts = [
    ...(shift.staff || []),
    shift.summary?.closingNote || '',
  ];
  (shift.transactions || []).forEach(tx => {
    parts.push(tx.kategori, tx.staff, tx.metode, tx.jenis, tx.deskripsi, ledgerDescription(tx), ledgerNoteShort(tx));
  });
  return parts.join(' ').toLowerCase();
}

// ── Daily cash flow totals (WITA calendar days, from transaction time) ──
const WITA_DAY = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Makassar', year: 'numeric', month: '2-digit', day: '2-digit' });
const dayKey  = (ms) => WITA_DAY.format(new Date(ms));
const nextDay = (key) => { const d = new Date(`${key}T00:00:00Z`); d.setUTCDate(d.getUTCDate() + 1); return d.toISOString().slice(0, 10); };

function isNonRevenueCategory(kategori) {
  return kategori === 'START BALANCE'
    || SYSTEM_NON_REVENUE.includes(kategori)
    || (DataStore.settings.nonRevenueCategories || []).includes(kategori);
}

// Each shift opens with START BALANCE, so the balance runs per shift. The
// end-of-day balance is the running balance after the last transaction that day.
function buildDailyCashFlow() {
  const groups = [...history.map(s => s.transactions || []), DataStore.transactions || []];
  const events = [];
  groups.forEach(txs => {
    let balance = 0;
    txs
      .map(tx => ({ tx, ms: new Date(tx.tanggalWaktu).getTime() }))
      .filter(e => Number.isFinite(e.ms))
      .sort((a, b) => a.ms - b.ms)
      .forEach(e => { balance += Number(e.tx.jumlah) || 0; events.push({ ...e, balance }); });
  });
  if (events.length === 0) return [];
  events.sort((a, b) => a.ms - b.ms);

  const range = dateBounds();
  const firstKey = range ? dayKey(range[0]) : dayKey(events[0].ms);
  const lastKey  = dayKey(range ? Math.min(range[1], Date.now()) : Date.now());
  if (firstKey > lastKey) return [];

  const emptyDay = () => ({ income: 0, outgoing: 0, cats: {}, nonRev: {}, txs: [], balance: null });
  const byDay = new Map();
  let opening = null;
  events.forEach(e => {
    const key = dayKey(e.ms);
    if (key < firstKey) { opening = e.balance; return; }
    if (key > lastKey) return;
    if (!byDay.has(key)) byDay.set(key, emptyDay());
    const day = byDay.get(key);
    const amount = Number(e.tx.jumlah) || 0;
    if (!isNonRevenueCategory(e.tx.kategori)) {
      if (e.tx.jenis === 'INCOME') day.income += amount;
      else day.outgoing += Math.abs(amount);
      day.cats[e.tx.kategori] = (day.cats[e.tx.kategori] || 0) + amount;
    } else {
      day.nonRev[e.tx.kategori] = (day.nonRev[e.tx.kategori] || 0) + amount;
    }
    day.txs.push(e.tx);
    day.balance = e.balance;
  });

  const days = [];
  let carry = opening;
  for (let key = firstKey; key <= lastKey; key = nextDay(key)) {
    const day = byDay.get(key) || emptyDay();
    if (day.balance === null) day.balance = carry;
    carry = day.balance;
    days.push({ key, ...day });
    if (days.length > 1000) break;
  }
  days.opening = opening;
  return days;
}

// Rental commission: guest rental total minus the owner share. Both categories
// are stored with their sign, so a reversed row reduces the total.
function rentalCommission(days) {
  return days.reduce((sum, day) => sum
    + (day.cats[RENTAL_GUEST_CATEGORY] || 0)
    + (day.cats[RENTAL_OWNER_CATEGORY] || 0), 0);
}

function dayCommission(day) {
  return (day.cats[RENTAL_GUEST_CATEGORY] || 0) + (day.cats[RENTAL_OWNER_CATEGORY] || 0);
}

function exportDailyCashFlow() {
  const days = buildDailyCashFlow();
  if (!days.length) { showAlert(t('chartNoData'), 'info'); return; }
  const lang = LangManager.current === 'id' ? 'id-ID' : 'en-US';
  const toDate = (key) => { const [y, m, d] = key.split('-').map(Number); return new Date(y, m - 1, d); };
  const weekday = (key) => toDate(key).toLocaleDateString(lang, { weekday: 'long' });
  const sumBy = (field) => {
    const totals = {};
    days.forEach(d => Object.entries(d[field]).forEach(([k, v]) => { totals[k] = (totals[k] || 0) + v; }));
    return totals;
  };
  const orderCats = (totals) => Object.keys(totals).sort((a, b) => (totals[b] > 0) - (totals[a] > 0) || Math.abs(totals[b]) - Math.abs(totals[a]));
  const revTotals = sumBy('cats'), nonRevTotals = sumBy('nonRev');
  const revCats = orderCats(revTotals), nonRevCats = orderCats(nonRevTotals);
  const money = '#,##0;-#,##0';

  const header = [t('xlDate'), t('xlDay'), t('chartIncome'), t('chartOutgoing'), t('chartNet'), t('chartCommission'),
    ...revCats.map(sanitizeForExcel), ...nonRevCats.map(k => `${sanitizeForExcel(k)} (${t('xlNonRevenue')})`),
    t('chartEndBalance'), t('xlTxCount')];
  const rows = days.map(d => [toDate(d.key), weekday(d.key), d.income, d.outgoing, d.income - d.outgoing, dayCommission(d),
    ...revCats.map(k => d.cats[k] || 0), ...nonRevCats.map(k => d.nonRev[k] || 0),
    d.balance, d.txs.length]);
  const totalIn  = days.reduce((s, d) => s + d.income, 0);
  const totalOut = days.reduce((s, d) => s + d.outgoing, 0);
  const commission = rentalCommission(days);
  const endBalance = days[days.length - 1].balance;
  rows.push([t('xlTotal'), '', totalIn, totalOut, totalIn - totalOut, commission,
    ...revCats.map(k => revTotals[k]), ...nonRevCats.map(k => nonRevTotals[k]),
    endBalance, days.reduce((s, d) => s + d.txs.length, 0)]);
  const daily = XLSX.utils.aoa_to_sheet([header, ...rows], { cellDates: true });
  const range = XLSX.utils.decode_range(daily['!ref']);
  for (let r = 1; r <= range.e.r; r++) {
    for (let c = 0; c <= range.e.c; c++) {
      const cell = daily[XLSX.utils.encode_cell({ r, c })];
      if (!cell) continue;
      if (c === 0 && cell.t === 'd') { cell.z = 'dd/mm/yyyy'; delete cell.w; }
      else if (c >= 2 && c < range.e.c && cell.t === 'n') { cell.z = money; delete cell.w; }
    }
  }
  daily['!cols'] = header.map((h, i) => ({ wch: i === 0 ? 12 : Math.max(12, String(h).length + 2) }));
  daily['!freeze'] = { xSplit: 2, ySplit: 1 };

  const period = `${days[0].key} – ${days[days.length - 1].key}`;
  const summary = XLSX.utils.aoa_to_sheet([
    [t('chartTitle')],
    [t('xlPeriod'), period],
    [t('xlDays'), days.length],
    [t('xlOpening'), days.opening ?? 0],
    [t('chartIncome'), totalIn],
    [t('chartOutgoing'), totalOut],
    [t('chartNet'), totalIn - totalOut],
    [t('chartCommission'), commission],
    [t('chartAvgDay'), Math.round((totalIn - totalOut) / days.length)],
    [t('chartEndBalance'), endBalance ?? 0],
    [],
    [t('xlNoteSummary')],
  ]);
  for (let r = 3; r <= 9; r++) {
    const cell = summary[XLSX.utils.encode_cell({ r, c: 1 })];
    if (cell) cell.z = money;
  }
  summary['!cols'] = [{ wch: 24 }, { wch: 28 }];

  const nonRevenueLabel = (k) => t(isNonRevenueCategory(k) ? 'xlYes' : 'xlNo');
  const txRows = days.flatMap(d => d.txs).map(tx => [
    new Date(tx.tanggalWaktu).toLocaleString(lang, { timeZone: 'Asia/Makassar' }),
    sanitizeForExcel(tx.jenis),
    sanitizeForExcel(tx.kategori),
    nonRevenueLabel(tx.kategori),
    sanitizeForExcel(rentalDeskripsiDisplay(tx)),
    Number(tx.jumlah) || 0,
    sanitizeForExcel(tx.metode),
    sanitizeForExcel(ledgerNote(tx.keterangan) || ''),
    sanitizeForExcel(tx.staff),
  ]);
  const txSheet = XLSX.utils.aoa_to_sheet([[t('xlDateTime'), t('xlType'), t('xlCategory'), t('xlNonRevenue'),
    t('xlDesc'), t('xlAmount'), t('xlMethod'), t('xlNote'), t('xlStaff')], ...txRows]);
  for (let r = 1; r <= txRows.length; r++) {
    const cell = txSheet[XLSX.utils.encode_cell({ r, c: 5 })];
    if (cell) cell.z = money;
  }
  txSheet['!cols'] = [{ wch: 22 }, { wch: 10 }, { wch: 20 }, { wch: 12 }, { wch: 28 }, { wch: 14 }, { wch: 10 }, { wch: 24 }, { wch: 10 }];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, daily, t('xlDaily'));
  XLSX.utils.book_append_sheet(wb, summary, t('xlSummary'));
  XLSX.utils.book_append_sheet(wb, txSheet, t('xlTransactions'));
  XLSX.writeFile(wb, `cash-flow_${days[0].key}_${days[days.length - 1].key}.xlsx`);
  showAlert(t('alertExcelOk'), 'success');
}

function renderChart() {
  const c = document.getElementById('chart-container');
  if (!c) return;
  const days = buildDailyCashFlow();
  const header = `
    <div class="chart-header">
      <h3>${t('chartTitle')}</h3>
      <button type="button" class="btn small success" id="chart-export">
        <i class="fas fa-file-excel"></i> ${t('chartExport')}
      </button>
    </div>`;
  const bindExport = () => {
    c.querySelector('#chart-export')?.addEventListener('click', exportDailyCashFlow);
  };

  if (!days.some(d => d.income || d.outgoing || d.balance !== null)) {
    c.innerHTML = `${header}<div class="chart-empty">${t('chartNoData')}</div>`;
    bindExport();
    return;
  }

  const totalIn  = days.reduce((s, d) => s + d.income, 0);
  const totalOut = days.reduce((s, d) => s + d.outgoing, 0);
  const net = totalIn - totalOut;
  const commission = rentalCommission(days);
  const endBalance = days[days.length - 1].balance;
  const kpi = (label, value, cls = '') => `
    <div class="chart-kpi ${cls}">
      <div class="chart-kpi-label">${label}</div>
      <div class="chart-kpi-value">${value}</div>
    </div>`;
  const kpis = `
    <div class="chart-kpis">
      ${kpi(t('chartIncome'), fmt(totalIn), 'in')}
      ${kpi(t('chartOutgoing'), fmt(totalOut), 'out')}
      ${kpi(t('chartNet'), fmt(net), net < 0 ? 'out' : '')}
      ${kpi(t('chartCommission'), fmt(commission), commission < 0 ? 'out' : 'in')}
      ${kpi(t('chartAvgDay'), fmt(Math.round(net / days.length)))}
      ${kpi(t('chartEndBalance'), endBalance === null ? '—' : fmt(endBalance), 'bal')}
    </div>`;

  c.innerHTML = `${header}${kpis}`;
  bindExport();
}

// ── Render ──
function renderReportPager(total, pages) {
  const pager = document.getElementById('report-pager');
  if (!pager) return;
  if (total === 0) { pager.hidden = true; pager.innerHTML = ''; return; }
  const start = (reportPage - 1) * REPORT_PAGE_SIZE + 1;
  const end = Math.min(total, reportPage * REPORT_PAGE_SIZE);
  pager.hidden = false;
  pager.innerHTML = `
    <button type="button" class="btn small" data-page="prev" ${reportPage <= 1 ? 'disabled' : ''}>${t('pagePrev')}</button>
    <span class="pager-status">${t('pageStatus', { page: reportPage, pages, start, end, total })}</span>
    <button type="button" class="btn small" data-page="next" ${reportPage >= pages ? 'disabled' : ''}>${t('pageNext')}</button>
  `;
}

function renderList() {
  const list = document.getElementById('shift-list');
  list.innerHTML = '';
  const matched = getFilteredShifts();
  const pages = Math.max(1, Math.ceil(matched.length / REPORT_PAGE_SIZE));
  if (reportPage > pages) reportPage = pages;
  if (reportPage < 1) reportPage = 1;
  const visible = matched.slice((reportPage - 1) * REPORT_PAGE_SIZE, reportPage * REPORT_PAGE_SIZE);
  renderReportPager(matched.length, pages);

  if (matched.length === 0) {
    const isFiltered = dateFilter.preset !== 'all' || reportQuery.trim() !== '';
    list.innerHTML = `
      <div class="empty-state">
        <i class="fas fa-box-open"></i>
        <p>${isFiltered ? t('noResultsRange') : t('noHistory')}</p>
        <p>${isFiltered ? '' : t('noHistoryHint')}</p>
      </div>`;
    updateToolbar();
    return;
  }

  visible.forEach(shift => {
    const card      = document.createElement('div');
    card.className  = 'shift-card' + (selectedIds.has(shift.id) ? ' selected' : '');
    card.dataset.id = shift.id;

    const staffStr = shift.staff?.join(', ') || '-';
    const txCount  = shift.transactions?.length || 0;
    const income   = shift.summary?.totalIncome   || 0;
    const outgoing = Math.abs(shift.summary?.totalOutgoing || 0);

    card.innerHTML = `
      <div class="shift-card-header">
        <label class="shift-check"><input type="checkbox" class="shift-checkbox" data-id="${shift.id}" ${selectedIds.has(shift.id) ? 'checked' : ''}></label>
        <div class="shift-card-info">
          <div class="shift-card-date">${fmtDate(shift.closedAt)}</div>
          <div class="shift-card-meta">
            <i class="fas fa-user"></i> ${escapeHtml(staffStr)} &nbsp;·&nbsp;
            <i class="fas fa-receipt"></i> ${txCount} ${t('transactions')}
          </div>
        </div>
        <div class="shift-card-badges">
          <span class="shift-badge income">+${fmt(income)}</span>
          <span class="shift-badge out">-${fmt(outgoing)}</span>
          <span class="shift-badge total">${fmt(shift.summary?.total || 0)}</span>
        </div>
        <i class="fas fa-chevron-down shift-chevron"></i>
      </div>
      <div class="shift-card-detail">${renderDetail(shift)}</div>
    `;

    card.querySelector('.shift-card-header').addEventListener('click', (e) => {
      if (e.target.closest('.shift-check')) return;
      card.classList.toggle('open');
    });

    card.querySelector('.shift-checkbox').addEventListener('change', (e) => {
      e.stopPropagation();
      if (e.target.checked) selectedIds.add(shift.id);
      else selectedIds.delete(shift.id);
      card.classList.toggle('selected', e.target.checked);
      updateToolbar();
    });

    card.querySelector('.btn-export-excel')?.addEventListener('click', () => exportShift(shift, 'excel'));
    card.querySelector('.btn-export-csv')?.addEventListener('click',   () => exportShift(shift, 'csv'));
    card.querySelector('.btn-delete-shift')?.addEventListener('click', (e) => {
      e.stopPropagation();
      askDelete(t('confirmDeleteShiftSingle', fmtDate(shift.closedAt)), [shift.id]);
    });

    list.appendChild(card);
  });

  updateToolbar();
}

function fmtDuration(startISO, endISO) {
  if (!startISO || !endISO) return null;
  const ms = new Date(endISO) - new Date(startISO);
  if (!isFinite(ms) || ms < 0) return null;
  const h = Math.floor(ms / 3600000);
  const m = Math.floor((ms % 3600000) / 60000);
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

function fmtShiftRange(startISO, endISO) {
  const lang = LangManager.current === 'id' ? 'id-ID' : 'en-US';
  const opts = { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' };
  const s = startISO ? new Date(startISO).toLocaleString(lang, opts) : '—';
  const e = new Date(endISO).toLocaleString(lang, opts);
  return `${s} → ${e}`;
}

function renderDetail(shift) {
  const s = shift.summary || {};
  const duration = fmtDuration(shift.startedAt, shift.closedAt);
  const range    = fmtShiftRange(shift.startedAt, shift.closedAt);
  // Flag long shifts (>24h) — likely forgot to close. Visual hint for audit.
  const isLong   = duration && (new Date(shift.closedAt) - new Date(shift.startedAt)) > 24 * 3600000;
  const durationBanner = `
    <div class="shift-duration-banner ${isLong ? 'long' : ''}">
      <i class="far fa-clock"></i> ${range}
      ${duration ? `<span class="dur-pill ${isLong ? 'long' : ''}">${duration}</span>` : ''}
      ${isLong ? `<span class="dur-warn"><i class="fas fa-exclamation-triangle"></i> &gt;24h</span>` : ''}
    </div>`;

  const fmtDiff = (val) => {
    if (val === null || val === undefined) return `<span style="color:var(--gray)">—</span>`;
    if (val === 0) return `<span class="hs-diff exact">${t('exact')}</span>`;
    const sign = val > 0 ? '+' : '';
    const cls  = val > 0 ? 'hs-diff over' : 'hs-diff short';
    const label = val > 0 ? t('over') : t('short');
    // Stacked: amount on top, label below — keeps Difference column narrow.
    return `<span class="${cls}"><span class="hs-diff-amt">${sign}${fmt(val)}</span><span class="hs-diff-label">${label}</span></span>`;
  };

  const hasActual = s.actualCash !== null && s.actualCash !== undefined;
  // Transfer/QRIS actuals were added later — legacy shifts won't have them.
  const hasActualTransfer = s.actualTransfer !== null && s.actualTransfer !== undefined;
  const hasActualQris     = s.actualQris     !== null && s.actualQris     !== undefined;

  const actualRow = (icon, label, expected, actual, selisih) => `
    <tr>
      <td class="hs-method">${icon} ${label}</td>
      <td class="hs-num">${fmt(expected || 0)}</td>
      <td class="hs-num hs-actual">${fmt(actual)}</td>
      <td class="hs-num">${fmtDiff(selisih)}</td>
    </tr>`;

  const actualSection = hasActual ? `
    <div class="hs-table-wrap">
      <table class="hs-actual-table">
        <thead>
          <tr>
            <th>${t('method')}</th>
            <th class="hs-num">${t('expected')}</th>
            <th class="hs-num">${t('actual')}</th>
            <th class="hs-num">${t('difference')}</th>
          </tr>
        </thead>
        <tbody>
          ${actualRow('💵', 'Cash', s.cash, s.actualCash, s.selisihCash)}
          ${actualRow('💳', 'Card', s.card, s.actualCard, s.selisihCard)}
          ${hasActualTransfer ? actualRow('🔄', 'Transfer', s.transfer, s.actualTransfer, s.selisihTransfer) : ''}
          ${hasActualQris     ? actualRow('📱', 'QRIS',     s.qris,     s.actualQris,     s.selisihQris)     : ''}
        </tbody>
      </table>
    </div>
    ${s.closingNote ? `
      <div style="background:var(--primary-50);border-left:3px solid var(--primary);padding:10px 12px;margin-bottom:16px;border-radius:var(--radius-xs);font-size:0.85rem">
        <strong>${t('closingNote')}:</strong> ${escapeHtml(s.closingNote)}
      </div>` : ''}` : '';

  const nonRevenueSet = new Set(DataStore.settings.nonRevenueCategories || []);
  const rows = (shift.transactions || []).slice().sort((a, b) =>
    (new Date(b.tanggalWaktu) - new Date(a.tanggalWaktu)) || ledgerTypeOrder(a, b)
  ).map(tx => {
    const isIncome = tx.jenis === 'INCOME';
    const badgeClass = (nonRevenueSet.has(tx.kategori) || SYSTEM_NON_REVENUE.includes(tx.kategori))
      ? 'nonrevenue-badge'
      : (isIncome ? 'income-badge' : 'outgoing-badge');
    return `
      <tr>
        <td style="white-space:nowrap">${escapeHtml(new Date(tx.tanggalWaktu).toLocaleString(LangManager.current === 'id' ? 'id-ID' : 'en-US'))}</td>
        <td><span class="${badgeClass}">${escapeHtml(tx.jenis)}</span></td>
        <td>${escapeHtml(tx.kategori)}</td>
        <td>${escapeHtml(ledgerDescription(tx))}</td>
        <td style="color:${isIncome ? 'var(--success)' : 'var(--danger)'};font-weight:500;white-space:nowrap">
          ${isIncome ? '+' : '-'}&nbsp;${fmt(Math.abs(tx.jumlah))}
        </td>
        <td>${escapeHtml(tx.metode)}</td>
        <td>${escapeHtml(ledgerNoteShort(tx) || '-')}</td>
        <td>${escapeHtml(tx.staff)}</td>
      </tr>`;
  }).join('');

  // New shifts store transfer+qris separately; legacy shifts have a single `other` field.
  const hasNewBreakdown = s.transfer !== undefined || s.qris !== undefined;
  const extraCards = hasNewBreakdown ? `
      <div class="detail-saldo-item">
        <div class="detail-saldo-label">${t('transferExpected')}</div>
        <div class="detail-saldo-amount">${fmt(s.transfer||0)}</div>
      </div>
      <div class="detail-saldo-item">
        <div class="detail-saldo-label">${t('qrisExpected')}</div>
        <div class="detail-saldo-amount">${fmt(s.qris||0)}</div>
      </div>` : `
      <div class="detail-saldo-item">
        <div class="detail-saldo-label">Other</div>
        <div class="detail-saldo-amount">${fmt(s.other||0)}</div>
      </div>`;

  // Revenue breakdown — only shown for shifts closed after this feature shipped.
  // Old shifts (missing totalRevenue field) skip this section gracefully.
  const hasRevenueBreakdown = s.totalRevenue !== undefined;
  const nonRevenueNet = (s.totalNonRevenueIn || 0) + (s.totalNonRevenueOut || 0);
  const hasNonRev     = nonRevenueNet !== 0;
  const revenueBreakdownSection = hasRevenueBreakdown ? `
    <div class="detail-summary" style="margin-bottom:14px">
      <div class="detail-saldo-item" style="background:var(--success-100)">
        <div class="detail-saldo-label">${t('shiftRevenue')}</div>
        <div class="detail-saldo-amount" style="color:var(--success-700)">${fmt(s.totalRevenue || 0)}</div>
      </div>
      <div class="detail-saldo-item" style="background:var(--danger-100)">
        <div class="detail-saldo-label">${t('shiftOperatingExpense')}</div>
        <div class="detail-saldo-amount" style="color:var(--danger-700)">${fmt(s.totalOperatingExpense || 0)}</div>
      </div>
      <div class="detail-saldo-item total-item">
        <div class="detail-saldo-label">${t('shiftNetRevenue')}</div>
        <div class="detail-saldo-amount">${fmt((s.totalRevenue || 0) + (s.totalOperatingExpense || 0))}</div>
      </div>
      ${hasNonRev ? `
        <div class="detail-saldo-item" style="background:var(--warning-100)">
          <div class="detail-saldo-label" style="color:var(--warning-700)">${t('shiftNonRevenue')}</div>
          <div class="detail-saldo-amount" style="color:var(--warning-700)">${fmt(nonRevenueNet)}</div>
        </div>` : ''}
    </div>` : '';

  return `
    ${durationBanner}
    ${revenueBreakdownSection}
    <div class="detail-summary">
      <div class="detail-saldo-item">
        <div class="detail-saldo-label">${t('cashExpected')}</div>
        <div class="detail-saldo-amount">${fmt(s.cash||0)}</div>
      </div>
      <div class="detail-saldo-item">
        <div class="detail-saldo-label">${t('cardExpected')}</div>
        <div class="detail-saldo-amount">${fmt(s.card||0)}</div>
      </div>${extraCards}
      <div class="detail-saldo-item total-item">
        <div class="detail-saldo-label">${t('totalSaldo')}</div>
        <div class="detail-saldo-amount">${fmt(s.total||0)}</div>
      </div>
    </div>
    ${actualSection}
    <div class="detail-actions">
      <button class="btn success btn-export-excel" title="${t('exportExcelBtn')}">
        <i class="fas fa-file-excel"></i> <span class="btn-label">${t('exportExcelBtn')}</span>
      </button>
      <button class="btn info btn-export-csv" title="${t('exportCsvBtn')}">
        <i class="fas fa-file-csv"></i> <span class="btn-label">${t('exportCsvBtn')}</span>
      </button>
      ${window._isAdmin ? `
        <button class="btn danger btn-delete-shift" style="margin-left:auto" title="${t('deleteShift')}">
          <i class="fas fa-trash"></i> <span class="btn-label">${t('deleteShift')}</span>
        </button>` : ''}
    </div>
    <div class="detail-table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date/Time</th><th>Type</th><th>Category</th><th>Description</th>
            <th>Amount</th><th>Method</th><th>Note</th><th>Staff</th>
          </tr>
        </thead>
        <tbody>${rows || `<tr><td colspan="8" style="text-align:center">${t('noTransactions')}</td></tr>`}</tbody>
      </table>
    </div>`;
}

// ── Toolbar ──
function updateToolbar() {
  const count   = selectedIds.size;
  const countEl = document.getElementById('selected-count');
  countEl.textContent = count > 0 ? `${count} ${t('transactions')} selected` : '';
  document.getElementById('btn-hapus-selected').disabled = count === 0;

  const sa = document.getElementById('select-all');
  if (history.length === 0 || count === 0) { sa.checked = false; sa.indeterminate = false; }
  else if (count === history.length)        { sa.checked = true;  sa.indeterminate = false; }
  else                                      { sa.checked = false; sa.indeterminate = true;  }
}

document.getElementById('select-all').addEventListener('change', (e) => {
  if (e.target.checked) history.forEach(s => selectedIds.add(s.id));
  else selectedIds.clear();
  renderList();
});

document.getElementById('btn-hapus-selected').addEventListener('click', () => {
  if (selectedIds.size === 0) return;
  askDelete(t('alertDeleteShift', selectedIds.size), [...selectedIds]);
});

// Delete is admin-only in the UI, and still asks for that admin's PIN.
let pendingDeleteIds = null;

function askDelete(message, ids) {
  if (!window._isAdmin) { showAlert(t('noPermission'), 'error'); return; }
  pendingDeleteIds = ids;
  document.getElementById('hist-confirm-message').textContent = message;
  document.getElementById('hist-confirm-pin').value = '';
  document.getElementById('hist-confirm').style.display = 'flex';
  setTimeout(() => document.getElementById('hist-confirm-pin').focus(), 50);
}

function hideDeleteConfirm() {
  pendingDeleteIds = null;
  document.getElementById('hist-confirm').style.display = 'none';
  document.getElementById('hist-confirm-pin').value = '';
}

async function verifyAdminPin(pin) {
  const user = window._currentUser;
  if (!user || user.role !== 'admin' || !user.pinHash || !pin) return false;
  const parts = String(user.pinHash).split(':');
  if (parts.length !== 3) return false;
  const salt = parts[1];
  const data = new TextEncoder().encode(salt + pin);
  const buf  = await crypto.subtle.digest('SHA-256', data);
  const got  = btoa(String.fromCharCode(...new Uint8Array(buf)));
  return got === parts[2];
}

async function confirmDelete() {
  const ids = pendingDeleteIds;
  if (!ids?.length) return;
  const pinOk = await verifyAdminPin(document.getElementById('hist-confirm-pin').value.trim());
  if (!pinOk) {
    showAlert(t('deletePinWrong'), 'error');
    const inp = document.getElementById('hist-confirm-pin');
    inp.value = '';
    inp.focus();
    return;
  }
  hideDeleteConfirm();
  try {
    await DataStore.deleteShifts(ids);
    ids.forEach(id => selectedIds.delete(id));
    renderList();
    renderChart();
    showAlert(t('alertShiftsDeleted'), 'success');
  } catch (err) {
    showAlert(`${t('alertShiftsDeleted')} (${err?.message || err})`, 'error');
  }
}

document.getElementById('hist-confirm-cancel').addEventListener('click', hideDeleteConfirm);
document.getElementById('hist-confirm-ok').addEventListener('click', confirmDelete);
document.getElementById('hist-confirm-pin').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') confirmDelete();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.getElementById('hist-confirm').style.display === 'flex') hideDeleteConfirm();
});

// ── Export ──
function sanitizeForExcel(value) {
  const str = String(value ?? '');
  return /^[=+\-@\t\r]/.test(str) ? `'${str}` : str;
}

function exportShift(shift, format) {
  const rows = (shift.transactions || []).map(tx => ({
    'Date/Time':   sanitizeForExcel(new Date(tx.tanggalWaktu).toLocaleString()),
    'Type':        sanitizeForExcel(tx.jenis),
    'Category':    sanitizeForExcel(tx.kategori),
    'Description': sanitizeForExcel(rentalDeskripsiDisplay(tx)),
    'Amount':      tx.jenis === 'INCOME' ? tx.jumlah : -Math.abs(tx.jumlah),
    'Method':      sanitizeForExcel(tx.metode),
    'Note':        sanitizeForExcel(ledgerNote(tx.keterangan) || ''),
    'Staff':       sanitizeForExcel(tx.staff)
  }));

  const dateStr  = new Date(shift.closedAt).toISOString().split('T')[0];
  const fileName = `shift_${dateStr}`;

  if (format === 'excel') {
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Transactions');
    XLSX.writeFile(wb, `${fileName}.xlsx`);
    showAlert(t('alertExcelOk'), 'success');
  } else {
    const csv  = Papa.unparse(rows);
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `${fileName}.csv`;
    link.click();
  }
}

// ── Date filter wiring ──
function setDatePreset(preset) {
  dateFilter.preset = preset;
  reportPage = 1;
  document.querySelectorAll('.date-preset').forEach(b => {
    b.classList.toggle('active', b.dataset.preset === preset);
  });
  document.getElementById('date-custom-group').style.display = preset === 'custom' ? '' : 'none';
  if (preset !== 'custom') {
    renderChart();
    renderList();
  } else if (dateFilter.from && dateFilter.to) {
    renderChart();
    renderList();
  }
}

document.querySelectorAll('.date-preset').forEach(btn => {
  btn.addEventListener('click', () => setDatePreset(btn.dataset.preset));
});
document.getElementById('report-search').addEventListener('input', (e) => {
  reportQuery = e.target.value;
  reportPage = 1;
  renderList();
});
document.getElementById('report-pager').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-page]');
  if (!btn || btn.disabled) return;
  reportPage += btn.dataset.page === 'next' ? 1 : -1;
  renderList();
});
document.getElementById('date-from').addEventListener('change', (e) => {
  dateFilter.from = e.target.value;
  reportPage = 1;
  if (dateFilter.to) { renderChart(); renderList(); }
});
document.getElementById('date-to').addEventListener('change', (e) => {
  dateFilter.to = e.target.value;
  reportPage = 1;
  if (dateFilter.from) { renderChart(); renderList(); }
});

// ── Init ──
initTheme();          // sync — theme persisted in localStorage, doesn't need Supabase

// Async bootstrap: check config → hydrate → auth → bind data → realtime → render.
(async function init() {
  DataStore.setMode('cloud');
  if (!SupabaseConfig.load()) {
    window.location.replace('index.html');
    return;
  }
  try {
    await DataStore.hydrate();
  } catch (e) {
    alert(`Connection failed: ${e?.message || e}\nRedirecting back to setup.`);
    window.location.replace('index.html');
    return;
  }
  // Auth check — needs users + session loaded from Supabase
  const localSession = await AuthStorage.getSession();
  if (DataStore.users.length === 0 || !localSession) {
    window.location.replace('index.html');
    return;
  }
  const user = DataStore.users.find(u => u.id === localSession.userId);
  if (!user) {
    window.location.replace('index.html');
    return;
  }
  window._currentUser = user;
  window._isAdmin     = user.role === 'admin';

  // Hide delete UI for non-admins (deferred from inline script — needed _isAdmin first)
  if (!window._isAdmin) {
    document.getElementById('history-toolbar').style.display = 'none';
    const s = document.createElement('style');
    s.textContent = '.shift-check{display:none}';
    document.head.appendChild(s);
  }

  // Bind history to live cache. Mutations from realtime echo here automatically.
  history = DataStore.shifts;

  // Realtime: re-render when shifts table changes from another device.
  DataStore.subscribeRealtime();
  DataStore.on('shifts', () => { renderList(); renderChart(); });
  DataStore.on('transactions', renderChart);
  DataStore.on('settings', renderChart);

  applyLang();
  renderChart();
  renderList();
})();
</script>
